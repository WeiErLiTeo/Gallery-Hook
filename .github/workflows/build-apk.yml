name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '编译类型 (Build Type)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21 (Required for AGP 9+)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Signing Keystore & Environment
        run: |
          # 准备 .env 文件，防止 secrets-gradle-plugin 报错
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # 解码仓库中自带的 debug.keystore.base64 或生成新证书
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK with Gradle
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="release"
          fi

          echo "Starting build with type: $BUILD_TYPE..."

          if [ "$BUILD_TYPE" = "debug" ]; then
            gradle :app:assembleDebug -Pandroid.builder.sdkDownload=true --stacktrace
          else
            gradle :app:assembleRelease -Pandroid.builder.sdkDownload=true --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalleryHook-${{ github.event.inputs.build_type || 'release' }}-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
