name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '编译类型'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Dummy Keystore and Env
        run: |
          touch .env
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK (Assemble Debug & Release)
        run: |
          BUILD_CHOICE="${{ github.event.inputs.build_type }}"
          if [ "$BUILD_CHOICE" = "release" ]; then
            gradle assembleRelease -Pandroid.builder.sdkDownload=true --stacktrace --info
          else
            gradle assembleDebug -Pandroid.builder.sdkDownload=true --stacktrace --info
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalleryHook-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
