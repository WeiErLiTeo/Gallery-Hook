name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '编译类型 (debug 或 release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK with Gradle
        run: |
          BUILD_CHOICE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_CHOICE" ]; then
            BUILD_CHOICE="debug"
          fi

          echo "Building APK for choice: $BUILD_CHOICE..."

          if [ "$BUILD_CHOICE" = "release" ]; then
            gradle :app:assembleRelease -Pandroid.builder.sdkDownload=true --no-daemon --stacktrace
          else
            gradle :app:assembleDebug -Pandroid.builder.sdkDownload=true --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalleryHook-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
