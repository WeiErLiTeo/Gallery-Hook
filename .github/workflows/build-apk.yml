name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '编译类型'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK with Gradle
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="release"
          fi
          
          if [ "$BUILD_TYPE" = "debug" ]; then
            gradle :app:assembleDebug -Pandroid.builder.sdkDownload=true --no-daemon
          else
            gradle :app:assembleRelease -Pandroid.builder.sdkDownload=true --no-daemon
          fi

      - name: Organize APK Output
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apk/GalleryHook.apk \;
          echo "APK prepared: $(ls -lh output_apk/GalleryHook.apk)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GalleryHook-APK
          path: output_apk/GalleryHook.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          name: GalleryHook 最新直装包 (APK)
          body: |
            ### 🚀 GalleryHook 最新安装包
            - **文件名**: `GalleryHook.apk`（点击下方 Assets 直接下载安装包，无需解压 ZIP）
            - **特性**: Release 瘦身优化版，移除调试符号与冗余日志，体积极致轻量。
          files: output_apk/GalleryHook.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
